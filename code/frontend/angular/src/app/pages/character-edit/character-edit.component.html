<div class="edit-container">
  <div *ngIf="loading" class="loading-message">Loading...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="character" class="form-container">
    <h2>Edit Character</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" [(ngModel)]="form.name" />
      </div>
      <div class="form-group">
        <label>Species *</label>
        <input type="text" [(ngModel)]="form.species" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="form.status">
          <option value="Alive">Alive</option>
          <option value="Dead">Dead</option>
          <option value="Unknown">Unknown</option>
        </select>
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select [(ngModel)]="form.gender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Genderless">Genderless</option>
          <option value="Unknown">Unknown</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Origin Name</label>
        <input type="text" [(ngModel)]="form.originName" />
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [(ngModel)]="form.image" />
      </div>
    </div>

    <div class="form-actions">
      <button class="save-btn" (click)="save()">Save</button>
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>
